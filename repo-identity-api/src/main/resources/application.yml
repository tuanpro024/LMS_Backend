spring:
  application:
    name: repo-identity-api
  data:
    mongodb:
      uri: mongodb://localhost:27017/lms_identity_db
      # Hoặc dùng cấu hình chi tiết:
      # host: localhost
      # port: 27017
      # database: lms_identity_db
      # username: mongodb_user
      # password: mongodb_password
      # authentication-database: admin
    redis:
      host: localhost
      port: 6379
#      password: redis_password
  kafka:
    bootstrap-servers: localhost:9092
  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:REDACTED_EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD:ewqi xxhp guko qznj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8081

security:
  jwt:
    public-key-path: file:secrets/jwt-public.pem
    private-key-path: file:secrets/jwt-private.pem
    issuer: repo-identity
    access-ttl: PT5M
    refresh-ttl: P7D

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:374015301382-7c753s91lnhu2a2kv1nn3lc682p7rj2p.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:REDACTED_GOOGLE_SECRET}

# Application Configuration
app:
  email:
    from: ${EMAIL_FROM:noreply@lms.com}
    from-name: ${EMAIL_FROM_NAME:LMS System}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
