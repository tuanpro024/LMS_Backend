spring:
  application:
    name: multimedia-service

  datasource:
    url: jdbc:mysql://localhost:3306/lms_media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8086

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: multimedia-service
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    com.lms.multimedia: DEBUG
    org.springframework.web: INFO

services:
  multimedia-service:
    container_name: multimedia-service
    image: multimedia-service
    ports:
      - "8086:8086"
    networks:
      - shared-network

  networks:
    shared-network:
      external: true

