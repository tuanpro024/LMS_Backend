spring:
  application:
    name: repo-notification
  datasource:
    url: jdbc:mysql://localhost:3306/lms_notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: sa
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: lms-kafka:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: latest
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:REDACTED_EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD:REDACTED_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  email:
    from: ${EMAIL_FROM:noreply@hocba.com}
    from-name: ${EMAIL_FROM_NAME:Hệ Thống Học Bá}
  frontend:
    url: ${FRONTEND_URL:https://lms.dangch.tech}

server:
  port: ${SERVER_PORT:8083}

security:
  jwt:
    public-key-path: file:secrets/jwt-public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

notification:
  kafka:
    topic: notification.events
    group: notification-service

package:
  status:
    kafka:
      topic: package.status.events
      group: notification-package-status
