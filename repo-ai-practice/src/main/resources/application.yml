spring:
  application:
    name: repo-ai-practice
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:lms-kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_ai_practice_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8096}

security:
  jwt:
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:file:secrets/jwt-public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    com.lms.aipractice: DEBUG
    org.hibernate.SQL: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

app:
  kafka:
    topics:
      ai-practice-progress-events: ai-practice.progress.events
  multimedia:
    base-url: ${MULTIMEDIA_BASE_URL:https://lms.dangch.tech}
    public-base-url: ${MULTIMEDIA_PUBLIC_BASE_URL:https://lms.dangch.tech}
    timeout-ms: ${MULTIMEDIA_TIMEOUT_MS:30000}
  ai:
    hsk-api:
      base-url: ${HSK_API_BASE_URL:https://hsk-ai.dangch.tech}
      timeout-ms: 60000
    polling:
      interval-ms: 3000
      max-retries: 5
      job-timeout-minutes: 10
