spring:
  application:
    name: repo-onl-learning

  datasource:
    url: jdbc:mysql://localhost:3306/lms_onl_learning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway manages schema
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  # ─── Email (JavaMailSender) — cùng SMTP với repo-identity ────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:REDACTED_EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD:REDACTED_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ─── Kafka (publish NotificationEvent → repo-notification) ───────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
    consumer:
      group-id: onl-learning-service

server:
  port: ${SERVER_PORT:8095}

# CMS integration
cms:
  base-url: https://cms.dangch.tech
  webclient:
    max-in-memory-mb: 32

# JWT RSA (same keypair as identity service)
security:
  jwt:
    public-key-path: file:secrets/jwt-public.pem
    issuer: repo-identity-api

# Cache TTLs (seconds)
cache:
  ttl:
    syllabus-list: 600 # 10 minutes
    syllabus-detail: 600 # 10 minutes

timetable:
  sync:
    batch-size: 500

system-sync:
  auto-sync:
    enabled: true
    cron: "0 0 1 * * *"
    zone: "Asia/Ho_Chi_Minh"

# Rate limiting
rate-limit:
  register:
    ip-capacity: 10 # requests per minute per IP
    user-capacity: 5 # requests per minute per userId

# Email sender identity
app:
  email:
    from: ${EMAIL_FROM:noreply@hocba.com}
    from-name: ${EMAIL_FROM_NAME:Học Bá}

# Kafka topic cho in-app notifications
notification:
  publisher:
    topic: ${NOTIFICATION_KAFKA_TOPIC:notification.events}

management:
  health:
    mail:
      enabled: false # tránh health-check fail khi SMTP chưa kết nối được
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    com.lms.onllearning: DEBUG
    org.hibernate.SQL: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

# URLs của các repo ôn luyện (Eureka load-balanced service names)
practice:
  service:
    flashcard-url: http://repo-flashcard
    writing-url: http://repo-writing
    kanji-url: http://repo-kanji-origin
    pronunciation-url: http://repo-pronunciation
    quiz-url: http://repo-quiz
