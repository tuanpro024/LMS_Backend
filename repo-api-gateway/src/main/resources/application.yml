spring:
  application:
    name: api-gateway
  #  autoconfigure:
  #    exclude:
  #      # Database Off
  #      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  #      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  #      # Spring security Off
  #      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
  #      password: redis_password
  cloud:
    gateway:
      httpclient:
        wiretap: true
      httpserver:
        wiretap: true

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "http://lms.dangch.tech"
              - "https://lms.dangch.tech"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - PreserveHostHeader
      discovery:
        locator:
          enabled: true
      routes:
        - id: identity
          uri: lb://REPO-IDENTITY-API
          predicates:
            - Path=${config.api-prefix}/id/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: realtime
          uri: lb:ws://REPO-REALTIME
          predicates:
            - Path=${config.ws-prefix}/realtime/**
            - Header=Upgrade, websocket
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: notification
          uri: lb://REPO-NOTIFICATION
          predicates:
            - Path=${config.api-prefix}/notification/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: flashcard
          uri: lb://REPO-FLASHCARD
          predicates:
            - Path=${config.api-prefix}/flashcard/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: writing
          uri: lb://REPO-WRITING
          predicates:
            - Path=${config.api-prefix}/writing/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: multimedia
          uri: lb://REPO-MULTIMEDIA
          predicates:
            - Path=/api/media/**,/api/subtitles/**,/api/packages/**,/api/folders/**,/api/study-sets/**
          # No StripPrefix - forward path as-is to multimedia service

        - id: dictionary
          uri: lb://REPO-DICTIONARY
          predicates:
            - Path=${config.api-prefix}/dictionary/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: learning-path
          uri: lb://REPO-LEARNING-PATH
          predicates:
            - Path=${config.api-prefix}/learning-path/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: listening-practice
          uri: lb://REPO-LISTENING-PRACTICE
          predicates:
            - Path=/api/listening-practice/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          # No StripPrefix - forward path as-is to listening-practice service
        - id: kanji-origin
          uri: lb://REPO-KANJI-ORIGIN
          predicates:
            - Path=${config.api-prefix}/kanji-origin/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: pronunciation
          uri: lb://REPO-PRONUNCIATION
          predicates:
            - Path=${config.api-prefix}/pronunciation/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: quiz
          uri: lb://REPO-QUIZ
          predicates:
            - Path=${config.api-prefix}/quiz/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: video-course
          uri: lb://REPO-VIDEO-COURSE
          predicates:
            - Path=${config.api-prefix}/video-course/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: payment
          uri: lb://REPO-PAYMENT
          predicates:
            - Path=${config.api-prefix}/payment/**
          filters:
            - StripPrefix=${config.strip-prefix}
        - id: online-learning
          uri: lb://REPO-ONL-LEARNING
          predicates:
            - Path=${config.api-prefix}/online-learning/**
          filters:
            - StripPrefix=${config.strip-prefix}

  main:
    web-application-type: reactive

config:
  api-prefix: /api
  ws-prefix: /ws
  strip-prefix: 2

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework:
      cloud.gateway: INFO
      web.reactive:
        socket:
          server: DEBUG
      messaging: DEBUG
    web.reactive.socket: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
